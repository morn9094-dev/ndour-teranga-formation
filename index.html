<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ndour Teranga Formation - Parcours</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f6f8}
.header{display:flex;justify-content:space-between;padding:15px 5%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.1);position:sticky;top:0}
.logo{font-weight:900;color:#ff6b00;display:flex;align-items:center;gap:10px}
.logo img{height:35px}
.hero{display:flex;flex-wrap:wrap;padding:30px 5%;background:linear-gradient(135deg,#fff7ed,#e0f2fe);gap:20px;align-items:center}
.hero h1{font-size:28px}.hero h1 span{color:#ff6b00}
.hero img{width:220px;height:220px;object-fit:cover;border-radius:15px;border:4px solid #fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px;padding:20px 5%}
.card{background:#fff;padding:15px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.08);border-left:5px solid #ff6b00;cursor:pointer}
.card:hover{transform:translateY(-3px)}
.count{background:#fff7ed;color:#ff6b00;padding:3px 8px;border-radius:10px;font-size:12px;font-weight:700}
.progress{height:6px;background:#eee;border-radius:10px;margin-top:8px;overflow:hidden}
.progress div{height:100%;background:#00c950}
.modal{display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:99}
.modal-content{background:#fff;margin:5% auto;padding:20px;width:90%;max-width:600px;border-radius:12px;max-height:80vh;overflow:auto}
.ex{display:flex;gap:10px;padding:8px;border-bottom:1px solid #eee}
</style>
</head>
<body>
<div class="header"><div class="logo"><img src="assets/logo.svg" onerror="this.src='logo.svg'"> NDOUR TERANGA</div><div>📞 +221 77 123 45 67</div></div>
<div class="hero"><div><h1>Plateforme de Formation <span>comme Clic-Formation</span></h1><p>6 Parcours - 72 Exercices - Progression sauvegardée</p><p style="margin-top:10px">🖱️ Souris ⌨️ Clavier 📁 Fichiers 🌐 Internet 📝 Word 📊 Excel</p></div><img src="assets/photo-formateur.jpg" onerror="this.src='photo-formateur.jpg'"></div>
<h2 style="text-align:center;margin-top:20px">Parcours d'auto-formation libre d'accès</h2>
<div class="grid" id="grid"></div>
<div id="modal" class="modal"><div class="modal-content"><span onclick="modal.style.display='none'" style="float:right;font-size:28px;cursor:pointer">&times;</span><h3 id="mtitle"></h3><div id="mlist"></div></div></div>
<script>
const parcours=[
{id:'souris',t:'Débutant - Souris',c:12,i:'🖱️',d:'12 exercices souris',ex:['Simple clic','Double clic','Clic droit','Glisser-déposer','Sélection','Molette','Précision 1','Précision 2','Labyrinthe','Tri icônes','Puzzle','Examen']},
{id:'clavier',t:'Clavier Niveau 1',c:12,i:'⌨️',d:'12 exercices clavier AZERTY',ex:['Lettres','Majuscules','Chiffres','Accents','Ponctuation','@ et €','Ctrl+C/V','Mot','Phrase','Vitesse 1','Vitesse 2','Test']},
{id:'fichiers',t:'Fichiers & Dossiers',c:12,i:'📁',d:'Créer, déplacer, ranger',ex:['Créer dossier','Renommer','Copier','Couper','Corbeille','Rechercher','Zip','Clé USB','Explorateur','Arborescence','Propriétés','Rangement']},
{id:'internet',t:'Internet & Mail',c:12,i:'🌐',d:'Recherche et messagerie',ex:['Google','Onglets','Historique','Favoris','Télécharger','Sécurité','Créer email','Pièce jointe','Répondre','Spam','Astuces','Test']},
{id:'word',t:'WORD',c:15,i:'📝',d:'Initiation Word 1-3',ex:['Saisie','Mise en forme','Police','Alignement','Puces','Tableau','Image','En-tête','Sauvegarde','CV','Lettre','Mise en page','Table matières','Fusion','Examen']},
{id:'excel',t:'EXCEL',c:12,i:'📊',d:'450 ex avec corrigés',ex:['Cellules','Somme','Moyenne','Si','Mise en forme cond','Tri','Filtre','Graphique','TCD','RechercheV','Budget','Examen']}
];
function getP(){return JSON.parse(localStorage.getItem('ndour')||'{}')}
function saveP(p){localStorage.setItem('ndour',JSON.stringify(p))}
function render(){
let g=document.getElementById('grid');let prog=getP();g.innerHTML='';
parcours.forEach(p=>{
let done=(prog[p.id]||[]).length;let pct=Math.round(done/p.c*100);
let div=document.createElement('div');div.className='card';
div.innerHTML=`<div style="font-size:36px">${p.i}</div><h3>${p.t}</h3><span class="count">${done}/${p.c}</span><p style="font-size:13px;color:#666;margin:6px 0">${p.d}</p><div class="progress"><div style="width:${pct}%"></div></div><small>${pct}%</small>`;
div.onclick=()=>openM(p);g.appendChild(div);
});
}
function openM(p){
let prog=getP();let set=new Set(prog[p.id]||[]);
document.getElementById('mtitle').innerText=p.t;
let l=document.getElementById('mlist');l.innerHTML='';
p.ex.forEach((e,i)=>{
let d=document.createElement('div');d.className='ex';
d.innerHTML=`<input type="checkbox" ${set.has(i)?'checked':''}><span>${i+1}. ${e}</span><span style="margin-left:auto;color:#ff6b00">Faire →</span>`;
d.querySelector('input').onchange=(ev)=>{
let cur=getP();if(!cur[p.id])cur[p.id]=[];
if(ev.target.checked){if(!cur[p.id].includes(i))cur[p.id].push(i)}else cur[p.id]=cur[p.id].filter(x=>x!=i);
saveP(cur);render();
};
l.appendChild(d);
});
document.getElementById('modal').style.display='block';
}
render();
</script>
</body>
</html>
